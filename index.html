<!DOCTYPE html>
<html lang="es" data-theme="indigo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PriceTracker</title>
    <meta name="theme-color" content="#3730A3">
    <!-- Pone el tema guardado antes de dibujar nada, para que no parpadee -->
    <script>try { var t = localStorage.getItem('priceTheme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PriceTracker">
    <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>
    <div id="root"><div class="boot">Cargando tus precios…</div></div>
    <noscript><div class="boot">PriceTracker necesita JavaScript para funcionar.</div></noscript>

    <!-- Las piezas de la app, en este orden -->
    <script src="js/util.js"></script>
    <script src="js/db.js"></script>
    <script src="js/images.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/native.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/ui-core.js"></script>
    <script src="js/ui-products.js"></script>
    <script src="js/ui-form.js"></script>
    <script src="js/ui-more.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
